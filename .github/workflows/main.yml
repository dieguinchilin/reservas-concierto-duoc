name: CI CD Reservas Concierto

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  compilar-y-desplegar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn -B clean verify

      - name: Desplegar en AWS EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -e

            echo "Descargando imagen Docker"
            docker pull dieguin1990/reservas-concierto:1.0

            echo "Deteniendo contenedor anterior"
            docker rm -f reservas-concierto-aws || true

            echo "Iniciando contenedor actualizado"
            docker run -d \
              --name reservas-concierto-aws \
              --restart unless-stopped \
              -p 8080:8080 \
              -v /mnt/efs/fs1:/app/efs \
              -e EFS_PATH=/app/efs \
              -e RESERVAS_SUBIR_S3=true \
              -e RESERVAS_BUCKET=reservas-concierto-duoc-2026-dcc \
              dieguin1990/reservas-concierto:1.0

            echo "Esperando inicio de Spring Boot"
            sleep 30

            echo "Comprobando API de reservas"
            curl --retry 6 \
              --retry-delay 5 \
              --retry-all-errors \
              -fsS \
              -o /dev/null \
              -w "HTTP %{http_code}\n" \
              -X POST \
              http://localhost:8080/api/reservas/ticket \
              -H "Content-Type: application/json" \
              -d '{"nombreCliente":"Juan Perez","correoCliente":"juan@example.com","nombreEvento":"Concierto de Rock 2026","cantidadEntradas":2}'

            echo "Despliegue completado"
