# Configuracion para logs de AWS
logging.level.software.amazon.awssdk=DEBUG
logging.level.io.awspring.cloud=DEBUG

# Configuracion de region AWS
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.region.auto=false

# Configuracion de reservas
reservas.subir-s3=false
reservas.bucket=reservas-concierto-duoc-2026-dcc

# Carpeta para guardar tickets PDF
efs.path=${EFS_PATH:./tickets}

# Puerto del microservicio
server.port=8080
